<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Veil inventory</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&amp;family=Cinzel:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1260px; height: 840px; overflow: hidden; background: #0b0d0e; color: #efe6d2; font-family: Alegreya, Georgia, serif">
  <img src="/_blob/35b736b0b2a627aef0fa5c42b20e024d" alt="" style="position: absolute; left: -50px; top: 0; width: 1361px; height: 907px; object-fit: cover; filter: blur(5px) brightness(.5)">
  <div style="position: absolute; inset: 0; background: linear-gradient(to right, rgba(6,8,9,.96) 0, rgba(6,8,9,.93) 62%, rgba(6,8,9,.72) 100%)"></div>

  <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 88px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 96px; box-sizing: border-box; border-right: 1px solid rgba(201,167,101,.32)">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <button aria-label="{{c.label}}" onClick="{{c.pick}}" style="width: 64px; height: 64px; border-radius: 32px; padding: 0; background: {{c.bg}}; border: 1px solid {{c.line}}; display: flex; align-items: center; justify-content: center">
        <img src="{{c.icon}}" alt="" style="width: 50px; height: 50px; opacity: {{c.op}}">
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 112px; top: 24px; width: 680px; height: 56px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: baseline; gap: 14px">
      <h1 style="margin: 0; font-family: Cinzel, serif; font-size: 28px; font-weight: 600; letter-spacing: 2px">Inventory</h1>
      <span style="font-size: 18px; color: #e6cf94">{{catLabel}}</span>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 44px; width: 230px; padding: 0 12px; box-sizing: border-box; border-bottom: 1px solid rgba(201,167,101,.6)">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" stroke="#e6cf94" stroke-width="1.4" fill="none"></circle><path d="M12 12l4.5 4.5" stroke="#e6cf94" stroke-width="1.4"></path></svg>
      <input aria-label="Search items" placeholder="Search" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #efe6d2; font-family: Alegreya, serif; font-size: 17px">
    </label>
  </div>

  <div style="position: absolute; left: 112px; top: 92px; width: 680px; display: grid; grid-template-columns: 52px minmax(0, 1fr) 72px 72px 80px; align-items: center; height: 44px; font-family: Cinzel, serif; font-size: 12px; letter-spacing: 1px; color: #e6cf94; border-bottom: 1px solid rgba(201,167,101,.6)">
    <span></span>
    <button onClick="{{sortName}}" style="height: 44px; background: none; border: 0; padding: 0; color: {{nameCol}}; font: inherit; letter-spacing: inherit; text-align: left">Name{{nameArrow}}</button>
    <button onClick="{{sortStat}}" style="height: 44px; background: none; border: 0; padding: 0; color: {{statCol}}; font: inherit; letter-spacing: inherit; text-align: right">Power{{statArrow}}</button>
    <span style="text-align: right">Durability</span>
    <button onClick="{{sortValue}}" style="height: 44px; background: none; border: 0; padding: 0; color: {{valueCol}}; font: inherit; letter-spacing: inherit; text-align: right">Value{{valueArrow}}</button>
  </div>

  <div style="position: absolute; left: 112px; top: 137px; width: 680px; height: 620px; overflow: hidden; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
      <button onClick="{{r.pick}}" style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 72px 72px 80px; align-items: center; height: 52px; flex: none; width: 100%; padding: 0; border: 0; border-bottom: 1px solid rgba(239,230,210,.08); background: {{r.bg}}; color: #efe6d2; font-family: Alegreya, serif; font-size: 18px; text-align: left">
        <img src="{{r.icon}}" alt="" style="width: 44px; height: 44px; margin-left: 2px">
        <span style="display: flex; align-items: center; gap: 8px; color: {{r.color}}; white-space: nowrap; overflow: hidden">
          <span>{{r.name}}</span>
          <sc-if value="{{r.eq}}" hint-placeholder-val="{{false}}">
            <img src="/_blob/d13ff079c66823debdab2e92cd7cc911" alt="Equipped" style="width: 15px; height: 13px">
          </sc-if>
        </span>
        <span style="text-align: right">{{r.stat}}</span>
        <span style="text-align: right; color: #d8cfba">{{r.dur}}</span>
        <span style="text-align: right; color: #d8cfba">{{r.value}}</span>
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 112px; bottom: 18px; width: 680px; height: 44px; display: flex; align-items: center; justify-content: space-between; font-size: 17px; border-top: 1px solid rgba(201,167,101,.32)">
    <span style="display: flex; align-items: center; gap: 8px"><img src="/_blob/1e196dd5b95a1f2a8a67e698853bd136" alt="Gold" style="width: 26px; height: 26px">12,480</span>
    <span style="color: #d8cfba">64 of 90 items</span>
    <a href="Main.dc.html" style="font-family: Cinzel, serif; font-size: 14px; letter-spacing: 1px; color: #e6cf94; text-decoration: none; height: 44px; display: flex; align-items: center">Back</a>
  </div>

  <div style="position: absolute; left: 824px; top: 24px; width: 412px; bottom: 18px; display: flex; flex-direction: column">
    <div style="display: flex; align-items: center; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid rgba(201,167,101,.6)">
      <img src="{{sel.icon}}" alt="" style="width: 96px; height: 96px">
      <div style="min-width: 0">
        <h2 style="margin: 0; font-family: Cinzel, serif; font-size: 22px; line-height: 28px; font-weight: 600; color: {{sel.color}}">{{sel.name}}</h2>
        <div style="font-size: 17px; color: #d8cfba; margin-top: 2px">{{sel.kind}}</div>
      </div>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between; padding: 18px 0 14px">
      <div>
        <div style="font-family: Cinzel, serif; font-size: 12px; letter-spacing: 1px; color: #e6cf94">{{sel.statLabel}}</div>
        <div style="font-family: Cinzel, serif; font-size: 50px; line-height: 56px; font-weight: 600">{{sel.stat}}</div>
      </div>
      <div style="text-align: right">
        <div style="font-size: 16px; color: #d8cfba">{{compareWith}}</div>
        <div style="font-size: 26px; font-weight: 700; color: {{deltaColor}}">{{deltaText}}</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; border-top: 1px solid rgba(239,230,210,.14)">
      <sc-for list="{{sel.lines}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; justify-content: space-between; align-items: center; min-height: 36px; border-bottom: 1px solid rgba(239,230,210,.14); font-size: 17px; gap: 12px">
          <span style="color: #d8cfba">{{l.k}}</span><span style="text-align: right">{{l.v}}</span>
        </div>
      </sc-for>
    </div>

    <div style="flex: 1"></div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 56px; background: rgba(201,167,101,.2); border: 1px solid #c9a765; color: #f7efdc; font-family: Cinzel, serif; font-size: 16px; font-weight: 600; letter-spacing: 1.5px">{{equipLabel}}</button>
      <button style="height: 56px; background: transparent; border: 1px solid rgba(201,167,101,.6); color: #efe6d2; font-family: Cinzel, serif; font-size: 16px; letter-spacing: 1.5px">Compare</button>
      <button style="height: 48px; background: transparent; border: 1px solid rgba(239,230,210,.25); color: #efe6d2; font-family: Cinzel, serif; font-size: 14px; letter-spacing: 1.5px">Favorite</button>
      <button style="height: 48px; background: transparent; border: 1px solid rgba(239,230,210,.25); color: #efe6d2; font-family: Cinzel, serif; font-size: 14px; letter-spacing: 1.5px">Junk</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1260,"height":840}}'>
var B = '/_blob/';
var COL = {common: '#efe6d2', uncommon: '#9bdc85', rare: '#8cc0ff', epic: '#cfa9ff', unique: '#f2c566'};
var CATS = [
  {id: 'all', label: 'All', icon: B + 'd80c4364504b067db581028b956cf879'},
  {id: 'weapon', label: 'Weapons', icon: B + '763cf70f139f8e57679e8c2a7e406af9'},
  {id: 'armor', label: 'Armor', icon: B + '1d0507547fdd2e079aedeff4bb40fdc4'},
  {id: 'acc', label: 'Accessories', icon: B + '5a7242cc99f404c433ab6ca19196eea6'},
  {id: 'use', label: 'Consumables', icon: B + 'f4d66f0732cf9684cc2d46cb9b2f8a48'},
  {id: 'comp', label: 'Components', icon: B + 'f1457f32ebe29fd467c7d96abfbd6c98'}
];
var IT = [
  {id: 'fallen', cat: 'weapon', slot: 'w', name: 'Sword of the Fallen', icon: '5ad31cc2e6a316c17a1522190e5beed6', kind: 'Longsword', stat: 48, label: 'Physical Damage', dur: '38/40', value: 1840, r: 'rare', eq: true, x: ['Fire damage +6', 'One gem socket']},
  {id: 'kel', cat: 'weapon', slot: 'w', name: "Kellerac's Sword", icon: '3927d493c088ef6323e5a7b500c248a6', kind: 'Longsword', stat: 54, label: 'Physical Damage', dur: '40/40', value: 2650, r: 'epic', x: ['Lightning damage +9', 'Two gem sockets']},
  {id: 'long', cat: 'weapon', slot: 'w', name: 'Longsword', icon: '863f3fd78086650eb727bdfed7d41bce', kind: 'Longsword', stat: 31, label: 'Physical Damage', dur: '22/30', value: 240, r: 'common', x: []},
  {id: 'great', cat: 'weapon', slot: 'w', name: 'Greatsword', icon: '984e4be3fb169a7acbb845660eed3da5', kind: 'Greatsword', stat: 62, label: 'Physical Damage', dur: '30/30', value: 410, r: 'uncommon', x: ['Critical chance +3%']},
  {id: 'song', cat: 'weapon', slot: 'w', name: 'Faeblades of Song', icon: '9a6b4e49b60f5e6f29a7c6500a0564be', kind: 'Faeblades', stat: 44, label: 'Physical Damage', dur: '33/35', value: 3100, r: 'unique', x: ['+10% Damage with Faeblades']},
  {id: 'chak', cat: 'weapon', slot: 'w', name: 'Chakrams', icon: '4dd300f4f6a477223cbe09ad5a72a4f7', kind: 'Chakrams', stat: 39, label: 'Physical Damage', dur: '25/25', value: 520, r: 'uncommon', x: []},
  {id: 'kite', cat: 'armor', slot: 's', name: 'Kite Shield', icon: '82db22f0073b2b911cea8fe6258575fd', kind: 'Shield', stat: 36, label: 'Armor', dur: '40/40', value: 360, r: 'common', x: []},
  {id: 'tuatha', cat: 'armor', slot: 'c', name: 'Elite Tuatha Cuirass', icon: 'd64f77b20dbcdf84fe9c7bf68ac6267e', kind: 'Cuirass', stat: 71, label: 'Armor', dur: '60/60', value: 2200, r: 'rare', eq: true, x: ['Health +30']},
  {id: 'vig', cat: 'armor', slot: 'c', name: 'Vigilant Cuirass', icon: '2912bf8dfcdda0043b71341f70af0c5d', kind: 'Cuirass', stat: 64, label: 'Armor', dur: '52/60', value: 1450, r: 'uncommon', x: []},
  {id: 'helm', cat: 'armor', slot: 'h', name: 'Helm of the Legion', icon: 'b8adc57bde585839b3e7821196a5d6ea', kind: 'Helm', stat: 28, label: 'Armor', dur: '35/35', value: 980, r: 'rare', eq: true, x: []},
  {id: 'zod', cat: 'armor', slot: 'b', name: 'Boots of the Zodiac', icon: 'ab07693e3d7320a2f1aca2cad136c22a', kind: 'Boots', stat: 19, label: 'Armor', dur: '30/30', value: 1120, r: 'epic', eq: true, x: []},
  {id: 'ring', cat: 'acc', slot: 'r', name: "Archsage's Ring", icon: 'a6f6b99010bd05a7e887d4a60a1b976b', kind: 'Ring', stat: 0, label: 'Mana', dur: '-', value: 870, r: 'rare', eq: true, x: ['Mana +40']},
  {id: 'hp', cat: 'use', slot: 'p', name: 'Greater Healing Potion', icon: '7821d6138d7c33a485b168619861991e', kind: 'Potion, 6 held', stat: 0, label: 'Health', dur: '-', value: 60, r: 'common', x: []},
  {id: 'mp', cat: 'use', slot: 'p', name: 'Master Mana Potion', icon: '980638fa0b3d0cd40098517144d9980d', kind: 'Potion, 3 held', stat: 0, label: 'Mana', dur: '-', value: 95, r: 'uncommon', x: []},
  {id: 'gem', cat: 'comp', slot: 'g', name: 'Restoring Gem', icon: '2ce9cf983eaf5228721a1b6c9873f031', kind: 'Gem', stat: 0, label: 'Socket effect', dur: '-', value: 310, r: 'rare', x: []}
];
function equippedFor(it) { return IT.filter(function (o) { return o.eq && o.slot === it.slot; })[0]; }
class Component extends DCLogic {
  constructor(p) { super(p); this.state = {cat: 'all', sel: 'kel', sort: 'stat', dir: -1}; }
  sortBy(k) {
    this.setState({sort: k, dir: this.state.sort === k ? -this.state.dir : (k === 'name' ? 1 : -1)});
  }
  renderVals() {
    var self = this, s = this.state;
    var list = IT.filter(function (i) { return s.cat === 'all' || i.cat === s.cat; }).slice();
    list.sort(function (a, b) {
      if (s.sort === 'name') return a.name.localeCompare(b.name) * s.dir;
      return ((s.sort === 'stat' ? a.stat - b.stat : a.value - b.value)) * s.dir;
    });
    var cur = IT.filter(function (i) { return i.id === s.sel; })[0] || list[0];
    var eq = equippedFor(cur);
    var delta = eq && eq !== cur && cur.stat ? cur.stat - eq.stat : null;
    var arrow = s.dir > 0 ? ' ▲' : ' ▼';
    return {
      cats: CATS.map(function (c) {
        var on = c.id === s.cat;
        return {label: c.label, icon: c.icon, bg: on ? 'rgba(201,167,101,.22)' : 'transparent', line: on ? '#c9a765' : 'transparent', op: on ? 1 : 0.72,
          pick: function () { self.setState({cat: c.id, sel: (IT.filter(function (i) { return c.id === 'all' || i.cat === c.id; })[0] || {}).id}); }};
      }),
      catLabel: CATS.filter(function (c) { return c.id === s.cat; })[0].label,
      rows: list.map(function (i) {
        return {name: i.name, icon: B + i.icon, color: COL[i.r], eq: !!i.eq, stat: i.stat || '-', dur: i.dur, value: i.value.toLocaleString('en-US'),
          bg: i.id === cur.id ? 'linear-gradient(to right, rgba(201,167,101,.28), rgba(201,167,101,.06))' : 'transparent',
          pick: function () { self.setState({sel: i.id}); }};
      }),
      sel: {name: cur.name, icon: B + cur.icon, color: COL[cur.r], kind: cur.kind, statLabel: cur.label, stat: cur.stat || '-',
        lines: [{k: 'Durability', v: cur.dur}, {k: 'Value', v: cur.value.toLocaleString('en-US') + ' gold'}].concat(cur.x.map(function (t) { return {k: 'Effect', v: t}; }))},
      compareWith: delta === null ? (cur.eq ? 'Equipped' : '') : 'vs ' + eq.name,
      deltaText: delta === null ? '' : (delta >= 0 ? '▲ +' + delta : '▼ ' + delta),
      deltaColor: delta !== null && delta < 0 ? '#ff9a7a' : '#8fe0cf',
      equipLabel: cur.eq ? 'Unequip' : 'Equip',
      sortName: function () { self.sortBy('name'); }, sortStat: function () { self.sortBy('stat'); }, sortValue: function () { self.sortBy('value'); },
      nameArrow: s.sort === 'name' ? arrow : '', statArrow: s.sort === 'stat' ? arrow : '', valueArrow: s.sort === 'value' ? arrow : '',
      nameCol: s.sort === 'name' ? '#f7efdc' : '#e6cf94', statCol: s.sort === 'stat' ? '#f7efdc' : '#e6cf94', valueCol: s.sort === 'value' ? '#f7efdc' : '#e6cf94'
    };
  }
}
</script>
</body>
</html>
